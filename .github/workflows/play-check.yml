name: Google Play check

# Checks that GitHub can reach Tellycine in Play Console with the PLAY_SERVICE_ACCOUNT_JSON secret,
# and lists the release tracks with their API names. Read-only: it opens a temporary edit, reads it
# and throws it away, so nothing changes in Play Console. Run it from the Actions tab at any time.
on:
  workflow_dispatch:
  push:
    paths: [ ".github/workflows/play-check.yml" ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google's auth library
        run: pip install --quiet google-auth requests

      - name: Connect to Play Console
        env:
          KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PACKAGE: app.tellycine
        run: |
          python - <<'PY'
          import json, os, sys
          from google.auth.exceptions import RefreshError
          from google.auth.transport.requests import AuthorizedSession, Request
          from google.oauth2 import service_account

          package = os.environ["PACKAGE"]
          api = f"https://androidpublisher.googleapis.com/androidpublisher/v3/applications/{package}"
          summary = open(os.environ["GITHUB_STEP_SUMMARY"], "a")

          def out(line=""):
              print(line)
              summary.write(line + "\n")

          def fail(message):
              print(f"::error::{message}")
              summary.write(f"\n**Failed:** {message}\n")
              sys.exit(1)

          raw = os.environ.get("KEY", "").strip()
          if not raw:
              fail("The PLAY_SERVICE_ACCOUNT_JSON secret is missing or empty. Add the service account's JSON key under Settings > Secrets and variables > Actions.")
          try:
              key = json.loads(raw)
          except ValueError:
              fail("PLAY_SERVICE_ACCOUNT_JSON isn't valid JSON. Paste the whole key file, braces included.")
          if key.get("type") != "service_account" or "private_key" not in key or "client_email" not in key:
              fail("PLAY_SERVICE_ACCOUNT_JSON is JSON but not a service account key (it needs type, client_email and private_key).")

          out("## Google Play connection check")
          out()
          out(f"- Service account: `{key['client_email']}`")
          out(f"- App: `{package}`")

          creds = service_account.Credentials.from_service_account_info(
              key, scopes=["https://www.googleapis.com/auth/androidpublisher"])
          try:
              creds.refresh(Request())
          except RefreshError as e:
              fail(f"Google refused the key ({e}). It may have been deleted, or the service account disabled: create a new JSON key and update the secret.")
          out("- Key accepted by Google ✅")

          session = AuthorizedSession(creds)

          def call(method, path):
              r = session.request(method, api + path, timeout=30)
              if r.status_code >= 400:
                  try:
                      message = r.json()["error"]["message"]
                  except Exception:
                      message = r.text[:300]
                  return None, r.status_code, message
              return (r.json() if r.content else {}), r.status_code, None

          edit, status, message = call("POST", "/edits")
          if edit is None:
              if "has not been used" in message or "is disabled" in message:
                  hint = "Turn on the Google Play Android Developer API in the service account's Google Cloud project, wait a few minutes and run this again."
              elif status in (401, 403):
                  hint = "In Play Console > Users and permissions, invite the service account's email above and give it access to Tellycine. New permissions can take a while to start working."
              elif status == 404:
                  hint = f"This account can't see an app with the package name {package} in Play Console."
              else:
                  hint = ""
              fail(f"Play Console refused access ({status}: {message}). {hint}")
          out("- Play Console access to the app ✅")

          edit_id = edit["id"]
          try:
              tracks, _, message = call("GET", f"/edits/{edit_id}/tracks")
              if tracks is None:
                  fail(f"Couldn't read the release tracks: {message}")
              out()
              out("### Tracks")
              out()
              out("| Track (API name) | Release | Version codes | Status |")
              out("|---|---|---|---|")
              for track in tracks.get("tracks", []):
                  for release in track.get("releases") or [{}]:
                      codes = ", ".join(release.get("versionCodes", [])) or "—"
                      out(f"| `{track['track']}` | {release.get('name', '—')} | {codes} | {release.get('status', '—')} |")

              listings, _, message = call("GET", f"/edits/{edit_id}/listings")
              out()
              if listings is None:
                  out(f"Couldn't read the store listing: {message}")
              else:
                  languages = ", ".join(l["language"] for l in listings.get("listings", [])) or "none"
                  out(f"Store listing languages: {languages}")
          finally:
              call("DELETE", f"/edits/{edit_id}")

          out()
          out("Nothing was changed in Play Console: the check opened a temporary edit, read it and threw it away.")
          PY
