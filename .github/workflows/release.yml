name: Release

# Publishes a release whenever a push to main carries a versionName (app/build.gradle.kts)
# that has not been released yet. Bump versionName in a PR; the release is cut when it merges.
on:
  push:
    branches: [ main ]
    paths-ignore: [ "README.md" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - name: Check whether this version is already released
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$version already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # Checked before anything is published, so a missing or overlong changelog can't stop the
      # Google Play upload after the GitHub release is out.
      - name: Check the Google Play release notes
        if: steps.version.outputs.skip != 'true'
        run: python3 .github/scripts/play.py notes

      - uses: actions/setup-java@v4
        if: steps.version.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.skip != 'true'

      # Every release must use the same signing key, or phones refuse to update the app.
      - name: Set up release signing key
        if: steps.version.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.TELLYCINE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Release signing secrets are missing. Add TELLYCINE_KEYSTORE_BASE64, TELLYCINE_KEYSTORE_PASSWORD, TELLYCINE_KEY_ALIAS and TELLYCINE_KEY_PASSWORD under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tellycine-release.jks"
          echo "TELLYCINE_KEYSTORE=$RUNNER_TEMP/tellycine-release.jks" >> "$GITHUB_ENV"

      # The APK is for installing directly; the app bundle (.aab) is what Google Play takes.
      - name: Test and build release APK and app bundle
        if: steps.version.outputs.skip != 'true'
        env:
          TELLYCINE_KEYSTORE_PASSWORD: ${{ secrets.TELLYCINE_KEYSTORE_PASSWORD }}
          TELLYCINE_KEY_ALIAS: ${{ secrets.TELLYCINE_KEY_ALIAS }}
          TELLYCINE_KEY_PASSWORD: ${{ secrets.TELLYCINE_KEY_PASSWORD }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          # Without Tellycine's own TMDB key, the release still works: people add their own.
          if [ -z "$TMDB_API_KEY" ]; then
            echo "::warning::The TMDB_API_KEY secret is missing, so this release has no built-in TMDB key: people will need their own for details from TMDB."
          fi
          ./gradlew --no-daemon :core:test :app:assembleRelease :app:bundleRelease

      # Refuse to publish an APK that isn't signed with the permanent Tellycine key.
      # (apksigner, not keytool: minSdk 26+ APKs only carry v2/v3 signatures.)
      - name: Verify signing certificate
        if: steps.version.outputs.skip != 'true'
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee certs.txt
          expected="b8c7bcc0a92a603ee9365d7d7a52a203cb29de8f89119fc9740a3412c08ef6b6"
          if ! grep -qi "certificate SHA-256 digest: $expected" certs.txt; then
            echo "::error::Release APK is not signed with the Tellycine release key (expected SHA-256 $expected)."
            exit 1
          fi
          # The app bundle carries a JAR signature; keytool prints its certificate as colon-separated hex.
          keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | tee aab-certs.txt
          if ! tr -d ':' < aab-certs.txt | grep -qi "SHA256 $expected"; then
            echo "::error::Release app bundle is not signed with the Tellycine release key (expected SHA-256 $expected)."
            exit 1
          fi

      - name: Create GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          apk="tellycine-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          aab="tellycine-${TAG}.aab"
          cp app/build/outputs/bundle/release/app-release.aab "$aab"
          # The same APK under a fixed name, so releases/latest/download/tellycine.apk always works
          # (handy when typing the address into a TV).
          cp "$apk" tellycine.apk
          cat > notes.md <<NOTES
          Tellycine ${TAG} — an IPTV player for Android phones, tablets and TVs (Android 8.0+).

          **Install:** download \`${apk}\` on your device and open it (allow installing from unknown sources when asked). On a TV, use the Downloader app with \`github.com/${GITHUB_REPOSITORY}/releases/latest/download/tellycine.apk\`.

          - M3U/M3U8 links, local M3U files, Xtream Codes and Dispatcharr, with multiple playlists
          - XMLTV TV guide, with a grid guide in landscape, and catch-up TV
          - Live TV, movies and series with favourites, continue watching and search
          - Offline downloads, Chromecast, and Open with… other players
          - Media3 player with picture-in-picture, track selection, resume and channel switching
          - Material 3 design with light and dark themes and phone/tablet layouts
          - Android TV and Google TV interface for the remote, with a grid guide and adding playlists from your phone

          \`${aab}\` is the app bundle for Google Play; it can't be installed directly.

          Signing certificate SHA-256: \`B8:C7:BC:C0:A9:2A:60:3E:E9:36:5D:7D:7A:52:A2:03:CB:29:DE:8F:89:11:9F:C9:74:0A:34:12:C0:8E:F6:B6\`

          Tellycine does not provide any content.
          NOTES
          # Per-version highlights, if present, go first.
          if [ -f "release-notes/${TAG}.md" ]; then
            { cat "release-notes/${TAG}.md"; echo; echo "---"; echo; cat notes.md; } > notes-full.md
            mv notes-full.md notes.md
          fi
          gh release create "$TAG" "$apk" "$apk.sha256" tellycine.apk "$aab" --target "$GITHUB_SHA" --title "Tellycine ${TAG}" --notes-file notes.md

  # Sends the new version to Google Play for review, using the app bundle from the GitHub release.
  # If it fails, fix the cause and use "Re-run failed jobs": the GitHub release stays as it is.
  google-play:
    needs: release
    if: needs.release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Closed testing. The Google Play check workflow lists every track's API name.
      PLAY_TRACK: alpha
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google's API client
        run: pip install --quiet -r .github/scripts/requirements.txt

      - name: Download the app bundle from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "tellycine-$TAG.aab"

      - name: Upload to Google Play and send for review
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          TAG: ${{ needs.release.outputs.tag }}
        run: python .github/scripts/play.py upload "tellycine-$TAG.aab" --track "$PLAY_TRACK"
