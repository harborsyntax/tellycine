name: Screenshots

# Renders documentation screenshots with Robolectric + Roborazzi (no emulator needed) and
# commits them to docs/images/screens on the same branch, along with the Google Play listing's
# screenshots and graphics in fastlane/metadata/android/en-GB/images. Run it from the Actions tab after
# UI changes, or it runs automatically when the screenshot tests change.
on:
  workflow_dispatch:
  push:
    branches-ignore: [ main ]
    paths:
      - "app/src/test/**"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Render screenshots
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests '*Screenshots*' --tests '*StoreGraphics*'

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-test-report
          path: app/build/reports/tests/

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            docs/images/screens/
            fastlane/metadata/android/en-GB/images/

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/screens fastlane/metadata/android/en-GB/images
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
          else
            git commit -m "Update documentation screenshots"
            git push
          fi
